name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Must run before checkout: core.autocrlf controls how the working
      # tree is written *during* checkout, so it has to be set before
      # actions/checkout runs (including its submodule checkout) to take
      # effect - setting it afterward would not re-normalize files already
      # written to disk.
      - name: Configure git line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
